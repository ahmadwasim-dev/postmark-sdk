openapi: 3.2.0
info:
  title: Postmark Email API
  description: 'Postmark helps deliver and track application email. In a nutshell, the

    service replaces SMTP (or Sendmail) with a far more reliable, scalable and

    care-free environment. In addition, you can track statistics such as

    number of emails sent or processed, opens, bounces and spam complaints.'
  version: 1.0.0
servers:
- url: http://{{baseurl}}
tags:
- name: Email
paths:
  /email:
    post:
      tags:
      - Email
      summary: Postmark Send a single email
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postEmail
      x-operation-id-source: derived
  /email/withTemplate:
    post:
      tags:
      - Email
      summary: Postmark Send an email using a Template
      requestBody:
        content: {}
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
      operationId: postEmailWithTemplate
      x-operation-id-source: derived
